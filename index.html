  el.innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin:6px 0 10px">
      <button class="wk-close" style="width:38px;height:38px" onclick="go('profile')" aria-label="${t('close')}">‹</button>
      <div><div class="title-xl" style="font-size:22px">${t('adm_title')}</div>
      <div class="sub"><span class="dot-on"></span>${on} ${t('adm_online')} · ${ADM.accounts.length} ${t('adm_accounts')}</div></div>
      <button class="btn ghost sm" style="margin-left:auto;width:auto;padding:8px 12px" onclick="loadAdmin()">↻</button></div>
    <div class="adm-tabs">${tabs.map(([k,l,n])=>`<button class="adm-tab ${ADM.tab===k?'on':''}" onclick="admTab('${k}')">${esc(l)}${n?`<span class="adm-badge">${n}</span>`:''}</button>`).join('')}</div>
    ${ADM.err?`<div class="card" style="border-color:var(--danger)"><b style="color:var(--danger)">${t('adm_error')}</b><div class="sub">${esc(ADM.err)}</div></div>`:''}
    ${ADM.loading?`<div class="adm-empty"><div class="spin"></div><p>${t('adm_loading')}</p></div>`:admBody()}`;
}
function admTab(k){ADM.tab=k;renderAdmin()}
function admBody(){return ADM.tab==='users'?admUsers():ADM.tab==='reqs'?admReqs():admLogView()}

function admUsers(){
  const fils=[['all',t('adm_all')],['active',t('st_active')],['pending',t('st_pending')],['scheduled',t('st_scheduled')],['expired',t('st_expired')],['blocked',t('st_blocked')]];
  let list=ADM.accounts.slice();
  if(ADM.q){const q=ADM.q.toLowerCase();list=list.filter(a=>(a.email||'').toLowerCase().includes(q))}
  if(ADM.filter!=='all')list=list.filter(a=>admRowState(a.uid)===ADM.filter);
  return `<input class="input txt" id="admQ" placeholder="${t('adm_search')}" value="${esc(ADM.q)}" oninput="ADM.q=this.value;admReRows()" style="margin-bottom:10px">
    <div class="adm-fils">${fils.map(([k,l])=>`<button class="chip ${ADM.filter===k?'on':''}" onclick="ADM.filter='${k}';renderAdmin()">${esc(l)}</button>`).join('')}</div>
    <div id="admRows">${admRows(list)}</div>`;
}
function admReRows(){
  let list=ADM.accounts.slice();
  if(ADM.q){const q=ADM.q.toLowerCase();list=list.filter(a=>(a.email||'').toLowerCase().includes(q))}
  if(ADM.filter!=='all')list=list.filter(a=>admRowState(a.uid)===ADM.filter);
  const c=document.getElementById('admRows');if(c)c.innerHTML=admRows(list);
}
function admRows(list){
  if(!list.length)return `<div class="adm-empty"><div style="font-size:34px">🗂️</div><p>${t('adm_none')}</p></div>`;
  return list.map(a=>{
    const adm=isAdminEmail(a.email),st=admRowState(a.uid),e=ADM.ents[a.uid];
    const plans=adm?ALL_PLAN_IDS.length:((e&&e.plans)||[]).length;
    return `<button class="adm-row tap" onclick="admOpen('${a.uid}')">
      <span class="adm-av" style="background:${statusColor(st)}22;color:${statusColor(st)}">${isOnline(a)?'<span class="dot-on"></span>':''}${esc((a.email||'?')[0].toUpperCase())}</span>
      <span class="adm-info"><b>${esc(a.email||a.uid)}${adm?' <span class="adm-crown">ADMIN</span>':''}</b>
        <span class="sub">${t('adm_lastSeen')}: ${a.lastSeen?fmtWhen(a.lastSeen):'—'} · ${plans} ${t('adm_plansShort')}</span></span>
      <span class="adm-st" style="color:${statusColor(st)};border-color:${statusColor(st)}55">${esc(statusLabel(st))}</span></button>`;
  }).join('');
}
function fmtWhen(ts){const d=Math.floor((Date.now()-ts)/60000);
  if(d<2)return t('adm_now');if(d<60)return d+' min';if(d<1440)return Math.floor(d/60)+' h';
  return new Date(ts).toLocaleDateString();}

/* ---- editor de una cuenta ---- */
function admOpen(uid){
  const a=ADM.accounts.find(x=>x.uid===uid)||{uid};
  const adm=isAdminEmail(a.email);
  const e=ADM.ents[uid]||{status:'pending',startAt:null,endAt:null,indefinite:true,plans:[]};
  const st=admRowState(uid);
  const iso=ts=>ts?new Date(ts).toISOString().slice(0,10):'';
  openModal(`<div style="display:flex;gap:12px;align-items:center;margin-bottom:4px">
      <div class="adm-av big" style="background:${statusColor(st)}22;color:${statusColor(st)}">${esc((a.email||'?')[0].toUpperCase())}</div>
      <div style="flex:1;min-width:0"><b style="font-size:16px;word-break:break-all">${esc(a.email||uid)}</b>
      <div class="sub">${esc(statusLabel(st))}${isOnline(a)?' · <span style="color:var(--ok)">'+t('adm_onlineNow')+'</span>':''}</div></div></div>
    ${adm?`<div class="card" style="border-color:var(--red);padding:12px;margin:10px 0"><b style="font-size:13px">👑 ${t('adm_isAdmin')}</b><div class="sub" style="font-size:12px">${t('adm_isAdminMsg')}</div></div>`:`
    <div class="h-sec" style="margin-top:14px">${t('adm_period')}</div>
    <div class="adm-dates">
      <label class="adm-lab">${t('adm_from')}<input type="date" class="input" id="edStart" value="${iso(e.startAt)}"></label>
      <label class="adm-lab">${t('adm_to')}<input type="date" class="input" id="edEnd" value="${iso(e.endAt)}" ${e.indefinite?'disabled':''}></label>
    </div>
    <label class="adm-check"><input type="checkbox" id="edInd" ${e.indefinite?'checked':''} onchange="document.getElementById('edEnd').disabled=this.checked"> ${t('adm_indef')}</label>
    <div class="h-sec">${t('adm_plans')}</div>
    <div class="adm-plans">${ALL_PLAN_IDS.map(id=>`<label class="adm-check"><input type="checkbox" class="edPlan" value="${id}" ${((e.plans)||[]).includes(id)?'checked':''}> ${esc(planLabel(id))}</label>`).join('')}</div>
    <button class="btn" style="margin-top:16px" onclick="admSave('${uid}','active')">${t('adm_saveActive')}</button>
    ${st==='blocked'
      ? `<button class="btn ghost" style="margin-top:8px" onclick="admSave('${uid}','active')">${t('adm_unblock')}</button>`
      : `<button class="btn ghost" style="margin-top:8px;color:var(--danger)" onclick="admBlock('${uid}')">${t('adm_block')}</button>`}
    `}
    <div class="h-sec">${t('adm_activity')}</div>
    <div class="card" style="padding:12px"><div class="rt-list">
      <div><span>${t('adm_created')}</span><small>${a.createdAt?new Date(a.createdAt).toLocaleDateString():'—'}</small></div>
      <div><span>${t('adm_lastLogin')}</span><small>${a.lastLogin?new Date(a.lastLogin).toLocaleString():'—'}</small></div>
      <div><span>${t('adm_lastSeen')}</span><small>${a.lastSeen?fmtWhen(a.lastSeen):'—'}</small></div>
      <div><span>${t('adm_logins')}</span><small>${a.loginCount||0}</small></div>
    </div></div>
    <button class="btn dark" style="margin-top:12px" onclick="closeModal()">${t('close')}</button>`);
}
function admCollect(){
  const s=document.getElementById('edStart').value,en=document.getElementById('edEnd').value;
  const ind=document.getElementById('edInd').checked;
  const plans=[...document.querySelectorAll('.edPlan')].filter(c=>c.checked).map(c=>c.value);
  return {startAt:s?new Date(s+'T00:00:00').getTime():null,
          endAt:(!ind&&en)?new Date(en+'T23:59:59').getTime():null,
          indefinite:!!ind,plans};
}
async function admWrite(uid,data,action,detail){
  try{
    await firebase.firestore().collection('entitlements').doc(uid).set(
      Object.assign({},data,{updatedAt:Date.now(),updatedBy:AUTH.email}),{merge:false});
    const em=(ADM.accounts.find(a=>a.uid===uid)||{}).email||uid;
    await admLog(action,em,detail||'');
    ADM.ents[uid]=Object.assign({},data);
    closeModal();toast(t('adm_saved'),'ok');
    const r=ADM.reqs.find(x=>x.uid===uid);if(r&&r.state==='open'){r.state='approved'}
    renderAdmin();
  }catch(e){toast(t('adm_error')+': '+(e.message||e),'warn')}
}
function admSave(uid,status){
  const a=ADM.accounts.find(x=>x.uid===uid)||{};
  if(isAdminEmail(a.email)){toast(t('adm_isAdminMsg'),'warn');return}
  const d=admCollect();
  if(!d.plans.length){toast(t('adm_needPlan'),'warn');return}
  if(!d.indefinite&&d.endAt&&d.startAt&&d.endAt<d.startAt){toast(t('adm_badDates'),'warn');return}
  const det=`${d.plans.length} planes · ${d.indefinite?t('adm_indef'):(d.startAt?new Date(d.startAt).toLocaleDateString():'—')+' → '+(d.endAt?new Date(d.endAt).toLocaleDateString():'—')}`;
  confirm2(t('adm_confirmSave'),det,t('adm_saveActive'),()=>{
    admWrite(uid,Object.assign({status:'active'},d),'access_granted',det);
    markRequestHandled(uid,'approved');
  });
}
function admBlock(uid){
  const a=ADM.accounts.find(x=>x.uid===uid)||{};
  if(isAdminEmail(a.email)){toast(t('adm_isAdminMsg'),'warn');return}
  confirm2(t('adm_confirmBlock'),a.email||uid,t('adm_block'),()=>{
    const e=ADM.ents[uid]||{startAt:null,endAt:null,indefinite:true,plans:[]};
    admWrite(uid,{status:'blocked',startAt:e.startAt||null,endAt:e.endAt||null,indefinite:e.indefinite!==false,plans:e.plans||[]},'blocked','');
  },true);
}
async function markRequestHandled(uid,state){
  try{await firebase.firestore().collection('accessRequests').doc(uid).set({state,handledAt:Date.now(),handledBy:AUTH.email},{merge:true})}catch(e){}
}

/* ---- bandeja de solicitudes ---- */
function admReqs(){
  const open=ADM.reqs.filter(r=>r.state==='open').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const done=ADM.reqs.filter(r=>r.state!=='open').sort((a,b)=>(b.handledAt||0)-(a.handledAt||0)).slice(0,20);
  if(!open.length&&!done.length)return `<div class="adm-empty"><div style="font-size:34px">📭</div><p>${t('adm_noReqs')}</p></div>`;
  return (open.length?`<div class="h-sec">${t('adm_pendingReqs')} (${open.length})</div>`+open.map(r=>`
      <div class="card" style="padding:14px">
        <b style="word-break:break-all">${esc(r.email||r.uid)}</b>
        <div class="sub">${r.createdAt?new Date(r.createdAt).toLocaleString():''}</div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn sm" style="flex:1" onclick="admOpen('${r.uid}')">${t('adm_approve')}</button>
          <button class="btn ghost sm" style="flex:1;color:var(--danger)" onclick="admReject('${r.uid}')">${t('adm_reject')}</button>
        </div></div>`).join(''):`<div class="adm-empty"><div style="font-size:34px">✅</div><p>${t('adm_noPending')}</p></div>`)
    +(done.length?`<div class="h-sec">${t('adm_handled')}</div>`+done.map(r=>`
      <div class="adm-row" style="cursor:default"><span class="adm-info"><b>${esc(r.email||r.uid)}</b>
      <span class="sub">${esc(r.state==='approved'?t('adm_approved'):t('adm_rejected'))} · ${r.handledAt?new Date(r.handledAt).toLocaleDateString():''}</span></span></div>`).join(''):'');
}
function admReject(uid){
  const r=ADM.reqs.find(x=>x.uid===uid)||{};
  confirm2(t('adm_confirmReject'),r.email||uid,t('adm_reject'),async()=>{
    await markRequestHandled(uid,'rejected');
    await admLog('rejected',r.email||uid,'');
    const x=ADM.reqs.find(y=>y.uid===uid);if(x)x.state='rejected';
    closeModal();toast(t('adm_saved'),'ok');renderAdmin();
  },true);
}

/* ---- historial ---- */
function admLogView(){
  if(!ADM.log.length)return `<div class="adm-empty"><div style="font-size:34px">🗒️</div><p>${t('adm_noLog')}</p></div>`;
  const ico={access_granted:'✅',blocked:'🚫',rejected:'❌',unblocked:'🔓'};
  return `<div class="card" style="padding:0"><div class="rt-list" style="padding:6px 14px">`+
    ADM.log.map(l=>`<div><span>${ico[l.action]||'•'} ${esc(t('adm_a_'+l.action)||l.action)} — ${esc(l.target||'')}</span>
      <small>${new Date(l.ts).toLocaleString()}${l.detail?' · '+esc(l.detail):''}</small></div>`).join('')+
    `</div></div>`;
}

/* =====================================================================
   MARCA DE AGUA Y DISUASIÓN DE COPIA
   En web/PWA no existe forma de impedir al 100 % una captura: una cámara
   externa siempre puede fotografiar la pantalla. Lo que sí se hace aquí
   es identificar cualquier copia que se filtre y poner difícil el
   copiado, la impresión y la descarga.
   ===================================================================== */
let wmTimer=null;
function wmText(){
  const d=new Date();
  const stamp=d.toLocaleDateString()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return ((AUTH&&AUTH.email)||'FM Velocity')+' · '+stamp;
}
function paintWatermark(){
  const el=document.getElementById('wmLayer');if(!el)return;
  const txt=esc(wmText());
  const cols=3,rows=7,jx=(Math.random()*8-4),jy=(Math.random()*8-4);
  let h='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c*(100/cols))+(r%2?100/cols/2:0)+jx/10, y=(r*(100/rows))+jy/10;
    h+=`<span class="wm-i" style="left:${x}%;top:${y}%">${txt}</span>`;
  }
  el.innerHTML=h;
}
function startWatermark(){
  // Marca de agua desactivada a peticion del usuario: afeaba la interfaz.
  // Se mantiene el resto de la proteccion: bloqueo de copia, seleccion,
  // arrastre, menu contextual, impresion y velado al perder el foco.
  const el=document.getElementById('wmLayer');
  if(el){el.style.display='none';el.innerHTML=''}
  clearInterval(wmTimer);wmTimer=null;
  document.body.classList.add('protected');
}
function stopWatermark(){
  const el=document.getElementById('wmLayer');if(el){el.style.display='none';el.innerHTML=''}
  clearInterval(wmTimer);wmTimer=null;
  document.body.classList.remove('protected');
}
/* oculta el contenido cuando la app deja de estar visible */
document.addEventListener('visibilitychange',()=>{
  if(!document.body.classList.contains('protected'))return;
  document.body.classList.toggle('veiled',document.hidden);
});
window.addEventListener('blur',()=>{if(document.body.classList.contains('protected'))document.body.classList.add('veiled')});
window.addEventListener('focus',()=>document.body.classList.remove('veiled'));
/* sin menú contextual ni arrastre dentro del contenido protegido */
document.addEventListener('contextmenu',e=>{
  if(document.body.classList.contains('protected')&&!e.target.closest('input,textarea'))e.preventDefault();
});
document.addEventListener('dragstart',e=>{if(document.body.classList.contains('protected'))e.preventDefault()});
/* copiar/cortar deshabilitado fuera de los campos de formulario */
['copy','cut'].forEach(ev=>document.addEventListener(ev,e=>{
  if(document.body.classList.contains('protected')&&!e.target.closest('input,textarea'))e.preventDefault();
}));


(function boot(){
  const cloudOk=initFirebase();
  let splashDone=false,authKnown=false;
  async function routeAfterSplash(){
    document.getElementById('splash').style.display='none';
    if(!cloudOk){ACCESS_STATE='offline';showAccessGate();return}   // sin Firebase no hay contenido
    if(!AUTH){showAuth();return}
    hideAuth();
    if(ACCESS_STATE==='unknown')await refreshEntitlement();
    if(ACCESS_STATE==='active')await enterApp(); else showAccessGate();
  }
  setTimeout(()=>{splashDone=true;routeAfterSplash()},3000);
  if(cloudOk){
    firebase.auth().onAuthStateChanged(async user=>{
      authKnown=true;
      if(user){
        AUTH=user;await loadCloud();startCloudSync();
        await registerAccount();
        const st=await refreshEntitlement();
        watchEntitlement();startPresence();
        if(st!=='active')await ensureAccessRequest();
        if(splashDone){
          hideAuth();
          if(st==='active'){if(!CUR&&document.getElementById('app').classList.contains('hidden'))await enterApp()}
          else showAccessGate();
        }
      }else{
        AUTH=null;if(cloudUnsub){cloudUnsub();cloudUnsub=null}
        if(entUnsub){entUnsub();entUnsub=null}stopPresence();stopWatermark();
        wipeProtectedContent();ENT=null;IS_ADMIN=false;ACCESS_STATE='unknown';hideAccessGate();
        if(splashDone)showAuth();
      }
    });
  }
  // Service worker + auto-actualización: si sale una versión nueva, recarga sola
  // (salvo que estés en medio de un entreno, para no interrumpir).
  if('serviceWorker' in navigator){
    const hadController=!!navigator.serviceWorker.controller;
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(refreshing||!hadController)return;   // no recargar en la primera instalación
      if(SESS)return;                          // no interrumpir un entrenamiento en curso
      refreshing=true;location.reload();
    });
    navigator.serviceWorker.register('service-worker.js').then(reg=>{
      // busca actualización cada vez que se abre
      reg.update&&reg.update();
      reg.addEventListener('updatefound',()=>{
        const newSW=reg.installing;
        newSW&&newSW.addEventListener('statechange',()=>{
          if(newSW.state==='installed'&&navigator.serviceWorker.controller&&!SESS){
            toast('Actualizando a la última versión…','ok');
          }
        });
      });
    }).catch(err=>console.log('SW registration failed:',err));
  }
})();
</script>
