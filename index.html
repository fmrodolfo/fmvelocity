<title>FM Velocity · by FM Athletes</title>
<script>
/* Tema visual: se aplica antes de pintar para que no haya parpadeo. Si el usuario ya eligió uno en este
   dispositivo se respeta; si no, FM Athletes (oscuro) es el tema por defecto. */
(function(){var T={'fm':'#061421','fm-light':'#F4F6F9','classic':'#0a0a0a'},t='fm';
  try{var v=localStorage.getItem('fmv_theme');if(v&&T[v])t=v}catch(e){}
  document.documentElement.setAttribute('data-theme',t);
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',T[t]);})();
</script>
<!-- Sin Firebase - datos guardados en localStorage del dispositivo -->
<style>
/* Temas. El tema se fija en <html data-theme="…"> (ver script del <head>). "fm" = FM Athletes (por defecto),
   "fm-light" = FM Athletes claro, "classic" = el diseño rojo y negro original de la app. Sólo cambian colores y
   tipografía; nada de lógica. Los nombres --red/--red-dark se conservan para no tocar cientos de reglas:
   ahora significan "color de acento" del tema. --acc-txt es el acento cuando se usa como TEXTO (más oscuro en
   el tema claro para cumplir WCAG AA) y --on-acc el texto que va encima de un botón de acento. */
@font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;src:url(montserrat-400.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url(montserrat-600.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url(montserrat-700.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:800 900;font-display:swap;src:url(montserrat-800.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:italic;font-weight:800;font-display:swap;src:url(montserrat-800-italic.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:italic;font-weight:900;font-display:swap;src:url(montserrat-900-italic.woff2) format('woff2')}
:root{
  --red:#BB9740; --red-dark:#8A6D2A; --red-glow:rgba(187,151,64,.32); --acc-rgb:187,151,64; --acc2:#D1B062;
  --acc-txt:#BB9740; --on-acc:#061421;
  --bg:#061421; --bg2:#0B1827; --card:#111D2C; --card2:#1A2738; --deep:#040E19; --bg-rgb:6,20,33;
  --line:#26374D; --txt:#F5F7FA; --muted:#9FAABB; --white:#ffffff; --hi:#ffffff; --grid:#ffffff; --logo-bg:#061421;
  --ok:#2ecc71; --warn:#f0a500; --danger:#ff3b30;
  --f-body:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,system-ui,sans-serif;
  --f-head:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  --head-style:italic; --head-w:900;
  --r:18px; --safe: env(safe-area-inset-bottom,0px);
}
:root[data-theme="fm-light"]{
  --red:#BB9740; --red-dark:#8A6D2A; --red-glow:rgba(187,151,64,.28); --acc-rgb:187,151,64; --acc2:#D1B062;
  --acc-txt:#7A5E1F; --on-acc:#061421;
  --bg:#F4F6F9; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#EEF1F5; --deep:#FFFFFF; --bg-rgb:244,246,249;
  --line:#D5DBE4; --txt:#061421; --muted:#4B5668; --white:#061421; --hi:#061421; --grid:#061421; --logo-bg:#061421;
  --danger:#C62828; --ok:#1E8E4E; --warn:#A86A00;
}
:root[data-theme="classic"]{
  --red:#E10600; --red-dark:#a30400; --red-glow:rgba(225,6,0,.45); --acc-rgb:225,6,0; --acc2:#ff3b28;
  --acc-txt:#FF4B3E; --on-acc:#ffffff;
  --bg:#0a0a0a; --bg2:#121214; --card:#17171a; --card2:#1e1e22; --deep:#000000; --bg-rgb:10,10,10;
  --line:#2a2a2e; --txt:#f5f5f7; --muted:#9a9aa2; --white:#ffffff; --hi:#ffffff; --grid:#ffffff; --logo-bg:#000000;
  --f-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,system-ui,sans-serif;
  --f-head:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,system-ui,sans-serif;
  --head-style:normal; --head-w:900;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f-body);
  background:var(--bg);color:var(--txt);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-2;
  background:radial-gradient(900px 500px at 80% -10%,rgba(var(--acc-rgb),.16),transparent 60%),
    radial-gradient(700px 600px at -10% 110%,rgba(var(--acc-rgb),.10),transparent 55%),
    linear-gradient(180deg,var(--bg),var(--deep))}
body::after{content:'';position:fixed;inset:0;z-index:-1;opacity:.04;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}
img{display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}

#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(88px + var(--safe))}
.screen{display:none;animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) both;padding:0 18px}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 var(--red-glow)}50%{box-shadow:0 0 26px 2px var(--red-glow)}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flick{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.05)}}

/* ============ SPLASH SCREEN ANIMATIONS (Modern + Technological + Brutal) ============ */

/* Grid background scanline animation */
@keyframes gridScan{
  0%{opacity:0.3;transform:translateY(-100%)}
  50%{opacity:0.6}
  100%{opacity:0.2;transform:translateY(100%)}
}

/* Logo entrance with scale + rotate */
@keyframes logoEnter{
  0%{
    opacity:0;
    transform:scale(0.3) rotateY(-180deg);
    filter:blur(20px)
  }
  60%{
    opacity:1;
    transform:scale(1.1) rotateY(10deg);
    filter:blur(0)
  }
  100%{
    opacity:1;
    transform:scale(1) rotateY(0deg);
    filter:blur(0);
    text-shadow:0 0 20px rgba(var(--acc-rgb),0.6)
  }
}

/* Logo pulse glow */
@keyframes logoPulse{
  0%,100%{
    filter:drop-shadow(0 0 10px rgba(var(--acc-rgb),0.4))
  }
  50%{
    filter:drop-shadow(0 0 25px rgba(var(--acc-rgb),0.8))
  }
}

/* Title text glitch effect */
@keyframes titleGlitch{
  0%{
    opacity:0;
    transform:translateY(30px) scaleX(0.8);
    text-shadow:none
  }
  35%{
    opacity:0.7;
    transform:translateY(0) scaleX(1);
    text-shadow:-2px 0 var(--red),2px 0 rgba(255,255,255,0.3)
  }
  70%{
    opacity:1;
    text-shadow:0 0 0 rgba(0,0,0,0)
  }
  100%{
    opacity:1;
    transform:translateY(0) scaleX(1);
    text-shadow:0 0 15px rgba(var(--acc-rgb),0.5)
  }
}

/* Subtitle fade in */
@keyframes subtitleFade{
  0%{
    opacity:0;
    transform:translateY(15px)
  }
  60%{
    opacity:0;
    transform:translateY(15px)
  }
  100%{
    opacity:0.8;
    transform:translateY(0)
  }
}

/* Splash exit - dramatic fade with blur */
@keyframes splashExit{
  0%{
    opacity:1;
    backdrop-filter:blur(0px)
  }
  85%{
    opacity:1;
    backdrop-filter:blur(0px)
  }
  100%{
    opacity:0;
    backdrop-filter:blur(8px);
    pointer-events:none
  }
}

/* Grid lines tech background */
@keyframes gridMove{
  0%{
    background-position:0 0
  }
  100%{
    background-position:0 100px
  }
}

#splash{
  position:fixed;inset:0;z-index:1000;
  background:linear-gradient(180deg,var(--bg) 0%,var(--card) 50%,var(--bg) 100%);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  animation:splashExit 3s ease-in forwards;
  perspective:1000px
}

/* Tech grid background */
#splash::before{
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(0deg,rgba(var(--acc-rgb),0.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(var(--acc-rgb),0.05) 1px,transparent 1px);
  background-size:40px 40px;
  background-position:0 0;
  animation:gridMove 4s linear infinite;
  z-index:1;
  pointer-events:none
}

/* Scanline effect */
#splash::after{
  content:'';
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    0deg,
    rgba(var(--acc-rgb),0.08) 0px,
    rgba(var(--acc-rgb),0.08) 2px,
    transparent 2px,
    transparent 4px
  );
  z-index:2;
  pointer-events:none;
  animation:none
}

.splash-content{
  position:relative;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
  text-align:center
}

.logo-splash{
  width:132px;
  height:132px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:var(--logo-bg);
  border-radius:28px;
  border:2px solid rgba(var(--acc-rgb),0.35);
  animation:logoEnter 1.2s cubic-bezier(0.34,1.56,0.64,1) both,
            logoPulse 2.5s ease-in-out 1.2s infinite;
  box-shadow:0 0 40px rgba(var(--acc-rgb),0.35),0 10px 30px rgba(0,0,0,0.4)
}

.logo-splash svg,.logo-splash img{
  width:100%;
  height:100%;
  object-fit:cover
}

.splash-title{
  font-size:48px;
  font-weight:900;
  letter-spacing:3px;
  margin:0;
  color:var(--white);
  animation:titleGlitch 1.4s cubic-bezier(0.25,0.46,0.45,0.94) 0.4s both;
  text-transform:uppercase;
  line-height:1.1
}

.splash-title span{
  color:var(--acc-txt);
  display:block;
  animation:titleGlitch 1.4s cubic-bezier(0.25,0.46,0.45,0.94) 0.5s both
}

.splash-subtitle{
  font-size:13px;
  letter-spacing:2px;
  color:var(--muted);
  text-transform:uppercase;
  font-weight:700;
  margin:0;
  animation:subtitleFade 1.2s ease-out 1.8s both
}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 18px 10px;position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,rgba(var(--bg-rgb),.92),rgba(var(--bg-rgb),.55) 70%,transparent);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:1px;font-size:19px}
.brand .lg{width:34px;height:34px;border-radius:10px;background:var(--logo-bg);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;
  box-shadow:0 6px 18px var(--red-glow);animation:glow 3.5s infinite}
.brand .lg svg,.brand .lg img{width:100%;height:100%;object-fit:cover}
.brand b{color:var(--white)} .brand span{color:var(--acc-txt)}
.avatar-mini{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--red);background:var(--card2)}
.avatar-mini.ph{display:grid;place-items:center;font-weight:800;color:var(--white)}

.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.card.pad0{padding:0}
.card .accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--red),var(--red-dark))}
.h-sec{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:22px 4px 12px;font-weight:800}
.title-xl{font-size:27px;font-weight:900;letter-spacing:.3px;margin:2px 0}
.sub{color:var(--muted);font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px;border-radius:15px;font-weight:800;font-size:16px;
  background:linear-gradient(135deg,var(--red),var(--acc2));color:var(--on-acc);box-shadow:0 10px 26px var(--red-glow);transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.sm{width:auto;padding:11px 16px;font-size:14px;border-radius:12px}
.btn.dark{background:var(--deep);border:1px solid var(--line);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--red);color:var(--on-acc);border-color:var(--acc-txt)}

/* gate + auth */
#gate,#auth{position:fixed;inset:0;z-index:100;background:radial-gradient(700px 500px at 50% 0%,rgba(var(--acc-rgb),.18),transparent),var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center}
.gate-logo{width:104px;height:104px;border-radius:28px;background:var(--logo-bg);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:18px;overflow:hidden;
  box-shadow:0 18px 50px var(--red-glow);animation:pop .6s both,glow 3.5s 1s infinite}
.gate-logo svg,.gate-logo img{width:100%;height:100%;object-fit:cover}
.gate-title{font-size:34px;font-weight:900;letter-spacing:2px}
.gate-title span{color:var(--acc-txt)}
.gate-sub{color:var(--muted);margin:6px 0 30px;letter-spacing:3px;font-size:12px;text-transform:uppercase}
.profile-grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;max-width:420px}
.p-item{display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .5s both}
.p-ava{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--line);background:var(--card2);transition:transform .15s;display:grid;place-items:center;font-size:34px;font-weight:900;color:var(--hi)}
.p-item:active .p-ava{transform:scale(.94)}
.p-item .p-ava.add{border-style:dashed;border-color:var(--acc-txt);color:var(--acc-txt);background:transparent}
.p-name{font-weight:700;font-size:15px}
.auth-box{width:100%;max-width:340px}
.auth-box .input{margin-bottom:12px}
.auth-alt{color:var(--muted);font-size:13px;margin-top:18px}
.auth-alt b{color:var(--acc-txt)}
.link{color:var(--acc-txt);font-weight:700;text-decoration:underline;cursor:pointer}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:520px;margin:0 auto;
  display:flex;justify-content:space-around;padding:10px 8px calc(10px + var(--safe));
  background:linear-gradient(180deg,rgba(var(--bg-rgb),.4),rgba(var(--bg-rgb),.96));backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav-b{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border-radius:14px;color:var(--muted);font-size:10px;font-weight:700;transition:color .2s;position:relative}
.nav-b svg{width:23px;height:23px}
.nav-b.on{color:var(--acc-txt)}
.nav-b.on::before{content:'';position:absolute;top:-1px;width:26px;height:3px;border-radius:3px;background:var(--red);box-shadow:0 0 12px var(--red-glow)}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 10px;text-align:center}
.stat b{display:block;font-size:23px;font-weight:900;color:var(--hi)}
.stat small{color:var(--muted);font-size:11px;letter-spacing:.5px}
.stat.red b{color:var(--acc-txt)}
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{width:96px;height:96px;flex:0 0 auto;position:relative}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:20px}

.plan-card{display:flex;align-items:center;gap:14px;cursor:pointer}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.cat-card{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;min-height:116px;padding:16px 15px;border-radius:18px;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);color:var(--txt);text-align:left;transition:transform .15s,border-color .15s}
.cat-card:active{transform:scale(.96);border-color:var(--acc-txt)}
.cat-card .cat-ic{font-size:30px;line-height:1}
.cat-card .cat-n{font-weight:800;font-size:15.5px;line-height:1.18}
.cat-card .cat-c{font-size:12px;color:var(--muted);font-weight:600}
.rt-subs{margin:14px 0 4px;display:flex;flex-direction:column;gap:7px}
.rt-sub{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;background:var(--card2);border:1px solid var(--line)}
.rt-sub-n{flex:1;font-size:13.5px;font-weight:700;line-height:1.2}
.rt-sub-r{flex:0 0 auto;font-size:11.5px;color:var(--muted);font-weight:600}
.rt-play{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:var(--on-acc);font-size:11px;box-shadow:0 3px 10px var(--red-glow)}
.rt-play:active{transform:scale(.9)}
.rt-play.off{background:transparent;border:1px dashed var(--line);box-shadow:none}
.ex-lib-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:2px}
.ex-lib-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:14px;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);color:var(--txt);font-weight:700;font-size:14.5px;transition:transform .15s,border-color .15s}
.ex-lib-card:active{transform:scale(.985);border-color:var(--acc-txt)}
.ex-lib-card .elc-ic{flex:0 0 auto;font-size:20px;width:26px;text-align:center}
.ex-lib-card .elc-n{flex:1;line-height:1.25}
.ex-lib-card .elc-go{flex:0 0 auto;color:var(--muted);font-size:20px;font-weight:900}
.plan-ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;overflow:hidden;
  background:var(--logo-bg);border:1px solid var(--line);box-shadow:0 8px 20px var(--red-glow)}
.plan-ico svg,.plan-ico img{width:100%;height:100%;object-fit:cover}
.plan-ico.lock{background:var(--card2);color:var(--muted);box-shadow:none;font-size:22px;font-weight:900}
.week{border:1px solid var(--line);border-radius:15px;margin-bottom:11px;overflow:hidden;background:var(--card);transition:border-color .2s}
.week.open{border-color:var(--acc-txt)}
.week-h{display:flex;align-items:center;gap:12px;padding:15px;cursor:pointer}
.week-num{width:38px;height:38px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-weight:900;font-size:15px;flex:0 0 auto}
.week.open .week-num{background:var(--red);color:var(--on-acc)}
.week-tag{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:800}
.week-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.week.open .week-body{max-height:900px}
.day-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-top:1px solid var(--line);cursor:pointer}
.day-row:active{background:var(--card2)}
.day-ico{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.day-row.done .day-ico{background:var(--ok);color:#000}
.caret{margin-left:auto;color:var(--muted);transition:transform .3s}
.week.open .caret{transform:rotate(90deg)}

#workout{position:fixed;inset:0;z-index:80;background:radial-gradient(600px 500px at 50% -5%,rgba(var(--acc-rgb),.18),transparent),var(--bg);display:none;flex-direction:column}
#workout.on{display:flex;animation:fadeUp .4s both}
.wk-top{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 8px;position:relative;z-index:6}
.wk-close{width:40px;height:40px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:20px;border:1px solid var(--line)}
.wk-prog{height:6px;background:var(--card2);border-radius:6px;margin:6px 18px 0;overflow:hidden}
.wk-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--acc2));border-radius:6px;transition:width .5s;box-shadow:0 0 12px var(--red-glow)}
.wk-body{flex:1;overflow-y:auto;padding:14px 18px 30px;display:flex;flex-direction:column}
.ex-count{color:var(--acc-txt);font-weight:900;letter-spacing:2px;font-size:13px}
.ex-name{font-size:30px;font-weight:900;line-height:1.05;margin:6px 0 2px}
.ex-ref{color:var(--muted);font-size:13px;margin-bottom:16px}
.set-list{display:flex;flex-direction:column;gap:10px}
.set{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;transition:.2s;animation:slideIn .35s both}
.set.done{opacity:.5;border-color:var(--ok)}
.set-chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;transition:.2s;font-size:15px}
.set.done .set-chk{background:var(--ok);border-color:var(--ok);color:#000}
.set-info{flex:1}
.set-w{font-size:24px;font-weight:900}
.set-w small{font-size:13px;color:var(--muted);font-weight:700}
.set-meta{font-size:12px;color:var(--muted)}
.set-pct{margin-left:auto;font-size:12px;font-weight:800;color:var(--acc-txt);background:rgba(var(--acc-rgb),.12);padding:4px 9px;border-radius:8px}
.rest{position:absolute;inset:0;z-index:5;background:rgba(var(--bg-rgb),.94);backdrop-filter:blur(10px);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.rest.on{display:flex;animation:fadeUp .3s both}
.rest h3{letter-spacing:3px;color:var(--muted);font-size:13px;text-transform:uppercase}
.timer-ring{width:220px;height:220px;position:relative;margin:16px 0}
.timer-ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;font-weight:900}
.rest-actions{display:flex;gap:10px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:520px;margin:0 auto;background:linear-gradient(180deg,var(--card),var(--bg2));
  border-top-left-radius:26px;border-top-right-radius:26px;border-top:1px solid var(--line);padding:22px 20px calc(26px + var(--safe));
  transform:translateY(110%);transition:transform .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 50px rgba(0,0,0,.6)}
.sheet.on{transform:none}
.sheet-grip{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 16px}
.feel-grid{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.feel{display:flex;align-items:center;gap:14px;padding:15px;border-radius:15px;background:var(--card2);border:1px solid var(--line);transition:.15s}
.feel:active{transform:scale(.98)}
.feel .emo{font-size:26px}
.feel b{display:block;font-size:15px}
.feel small{color:var(--muted);font-size:12px}
.feel.f1{border-left:4px solid #3aa0ff}.feel.f2{border-left:4px solid var(--ok)}
.feel.f3{border-left:4px solid var(--warn)}.feel.f4{border-left:4px solid #ff7a00}
.feel.f5{border-left:4px solid var(--danger)}
.coach-box{background:linear-gradient(135deg,rgba(var(--acc-rgb),.14),rgba(var(--acc-rgb),.03));border:1px solid rgba(var(--acc-rgb),.35);border-radius:15px;padding:15px;margin:14px 0;display:flex;gap:12px}
.coach-ava{width:38px;height:38px;border-radius:11px;flex:0 0 auto;background:linear-gradient(135deg,var(--red),var(--acc2));display:grid;place-items:center;font-size:18px;box-shadow:0 6px 16px var(--red-glow)}
.coach-box p{font-size:14px;line-height:1.45}
.coach-box .who{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--acc-txt);font-weight:800;margin-bottom:2px}
.modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:22px}
.modal.on{display:flex;animation:fadeUp .3s both}
.modal-card{width:100%;max-width:420px;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:22px;padding:24px;max-height:88vh;overflow-y:auto}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:7px}
.input{width:100%;padding:15px;border-radius:13px;background:var(--deep);border:1px solid var(--line);color:var(--hi);font-size:17px;font-weight:700;text-align:center}
.input.txt{text-align:left;font-weight:600;font-size:16px}
.input:focus{outline:none;border-color:var(--acc-txt)}
textarea.input{text-align:left;font-weight:500;font-size:13px;font-family:monospace;min-height:130px;resize:vertical}
.max-in{display:flex;align-items:center;gap:12px;background:var(--deep);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:12px}
.max-in .mi-ico{width:40px;height:40px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:19px}
.max-in .mi-t{flex:1}.max-in .mi-t b{font-size:15px}.max-in .mi-t small{color:var(--muted);font-size:11px;display:block}
.max-in input{width:96px;background:transparent;border:none;color:var(--acc-txt);font-size:26px;font-weight:900;text-align:right}
.max-in input:focus{outline:none}
.max-in .unit{color:var(--muted);font-weight:800}
.chart-card svg{width:100%;height:auto;display:block;overflow:hidden}
.chart-card{margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legend i{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend i b{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar-track{height:9px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:6px}
.bar-track i{display:block;height:100%;border-radius:9px;transform-origin:left;animation:barGrow .8s both}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .em{font-size:44px;margin-bottom:10px;opacity:.5}
.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%) translateY(-90px);z-index:600;background:var(--card2);border:1px solid var(--line);
  padding:13px 20px;border-radius:14px;font-weight:700;font-size:14px;transition:transform .4s;box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:90%;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--ok)} .toast.warn{border-color:var(--warn)}
.hidden{display:none!important}
.rt-list{margin-top:6px}
.rt-list div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.rt-list div:last-child{border:none}
.rt-list small{color:var(--muted)}
.hist-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.hist-row .hi{width:40px;height:40px;border-radius:11px;background:var(--card2);display:grid;place-items:center;flex:0 0 auto;font-size:16px}
.badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;letter-spacing:.5px}
.badge.b1{background:rgba(58,160,255,.15);color:#3aa0ff}.badge.b2{background:rgba(46,204,113,.15);color:var(--ok)}
.badge.b3{background:rgba(240,165,0,.15);color:var(--warn)}.badge.b4{background:rgba(255,122,0,.15);color:#ff7a00}
.badge.b5{background:rgba(255,59,48,.15);color:var(--danger)}
.swatch{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* ============ TRANSICIONES MODERNAS (punto 10) ============ */
@keyframes screenIn{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
@keyframes cardRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes floatGlow{0%,100%{box-shadow:0 0 0 0 var(--red-glow)}50%{box-shadow:0 0 22px 1px var(--red-glow)}}
.screen.active{animation:screenIn .5s cubic-bezier(.16,.84,.3,1) both}
/* aparición escalonada de tarjetas dentro de cada pantalla */
.screen.active>.card,.screen.active>.stat-row,.screen.active>.h-sec,.screen.active>[data-rise],.screen.active>.week{animation:cardRise .55s cubic-bezier(.16,.84,.3,1) both}
.screen.active>*:nth-child(1){animation-delay:.02s}
.screen.active>*:nth-child(2){animation-delay:.06s}
.screen.active>*:nth-child(3){animation-delay:.10s}
.screen.active>*:nth-child(4){animation-delay:.14s}
.screen.active>*:nth-child(5){animation-delay:.18s}
.screen.active>*:nth-child(6){animation-delay:.22s}
.screen.active>*:nth-child(7){animation-delay:.26s}
.screen.active>*:nth-child(8){animation-delay:.30s}
.card{transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s,box-shadow .22s}
.card.tap:active{transform:scale(.98)}
.btn{position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(255,255,255,.35),transparent 45%);opacity:0;transition:opacity .5s}
.btn:active::after{opacity:1;transition:opacity 0s}
.nav-b{transition:color .2s,transform .15s}
.nav-b:active{transform:scale(.9)}
.nav-b.on svg{animation:pop .4s both}
.modal-card{animation:pop .32s cubic-bezier(.16,.84,.3,1) both}
.chip{transition:transform .15s,background .2s,color .2s,border-color .2s}
.chip:active{transform:scale(.94)}

/* ============ SELECTOR DE IDIOMA ============ */
.lang-row{display:flex;gap:8px;margin-top:4px}
.lang-b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:14px;background:var(--card2);border:1px solid var(--line);transition:.18s}
.lang-b .fl{font-size:24px}
.lang-b b{font-size:12px}
.lang-b.on{border-color:var(--acc-txt);background:rgba(var(--acc-rgb),.12);box-shadow:0 6px 16px var(--red-glow)}

/* ============ REGISTRO DE PESO EN ACCESORIOS (punto 7) ============ */
.set.log .set-info{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wlog{display:flex;align-items:center;gap:6px;background:var(--deep);border:1px solid var(--line);border-radius:11px;padding:6px 10px}
.wlog input{width:60px;background:transparent;border:none;color:var(--acc-txt);font-size:20px;font-weight:900;text-align:right}
.wlog input:focus{outline:none}
.wlog .u{color:var(--muted);font-weight:800;font-size:13px}
.set-hint{font-size:11px;color:var(--muted);margin-top:3px}
.set-hint b{color:#ffb03a}

/* ============ SIGUIENTES EJERCICIOS (punto 8) ============ */
.up-next{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.up-next .un-h{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.up-next .un-t{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc-txt);font-weight:800}
.up-next .un-list{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.up-next .un-i{display:flex;align-items:center;gap:10px;font-size:13.5px}
.up-next .un-n{width:22px;height:22px;border-radius:7px;background:var(--card2);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);flex:0 0 auto}
.up-next .un-i.first .un-n{background:var(--red);color:var(--on-acc)}
.up-next .un-x{color:var(--muted);font-size:12px;margin-left:auto}
.up-next .un-caret{color:var(--muted);transition:transform .3s;font-size:18px}
.up-next.closed .un-list{display:none}
.up-next.closed .un-caret{transform:rotate(-90deg)}
.up-done{color:var(--muted);font-size:12.5px;text-align:center;padding:6px}

/* ============ PROGRESO PRO (punto 9) ============ */
.pg-hero{background:linear-gradient(135deg,rgba(var(--acc-rgb),.16),rgba(var(--acc-rgb),.02));border:1px solid rgba(var(--acc-rgb),.3);border-radius:18px;padding:18px;margin-bottom:14px}
.pg-metric{display:flex;align-items:flex-end;gap:8px}
.pg-metric b{font-size:40px;font-weight:900;line-height:1}
.pg-metric .u{color:var(--muted);font-weight:800;font-size:15px;margin-bottom:5px}
.pg-metric .dlt{margin-left:auto;font-size:13px;font-weight:800;padding:4px 10px;border-radius:9px}
.pg-metric .dlt.up{background:rgba(46,204,113,.15);color:var(--ok)}
.pg-metric .dlt.down{background:rgba(58,160,255,.15);color:#3aa0ff}
.pg-metric .dlt.flat{background:var(--card2);color:var(--muted)}
.daily-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px;margin-bottom:14px}
.daily-c{background:var(--card2);border:1px solid var(--line);border-radius:15px;padding:14px}
.daily-c .dc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.daily-c .dc-ico{font-size:20px}
.daily-c .dc-lbl{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:800}
.daily-c .dc-val{font-size:22px;font-weight:900}
.daily-c .dc-val small{font-size:12px;color:var(--muted);font-weight:700}
.daily-c .dc-bar{height:7px;background:var(--deep);border-radius:7px;overflow:hidden;margin-top:9px}
.daily-c .dc-bar i{display:block;height:100%;border-radius:7px;transition:width .5s}
.daily-c .dc-btns{display:flex;gap:6px;margin-top:10px}
.mini-b{flex:1;padding:8px;border-radius:10px;background:var(--deep);border:1px solid var(--line);font-weight:800;font-size:14px;transition:.15s}
.mini-b:active{transform:scale(.94);border-color:var(--acc-txt)}
.goal-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px}
.goal-pill.on{background:var(--red);border-color:var(--acc-txt);color:var(--on-acc)}
.ai-tip{background:linear-gradient(135deg,rgba(var(--acc-rgb),.12),rgba(var(--acc-rgb),.02));border:1px solid rgba(var(--acc-rgb),.3);border-radius:15px;padding:15px;display:flex;gap:12px;margin-bottom:14px}
.ai-tip .ai-ava{width:40px;height:40px;border-radius:12px;flex:0 0 auto;background:linear-gradient(135deg,var(--red),var(--acc2));display:grid;place-items:center;font-size:20px;box-shadow:0 6px 16px var(--red-glow)}
.ai-tip .who{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--acc-txt);font-weight:800;margin-bottom:3px}
.ai-tip p{font-size:13.5px;line-height:1.5}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ============ RULETA / CARRUSEL DE EJERCICIOS (entreno) ============ */
.ex-carousel{display:flex;align-items:stretch;gap:8px;overflow-x:auto;overflow-y:hidden;padding:6px 2px 10px;margin:2px -18px 8px;min-height:98px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.ex-carousel::-webkit-scrollbar{height:0}
.ex-carousel .pad{flex:0 0 14px}
.ex-chip{flex:0 0 auto;scroll-snap-align:center;width:150px;min-height:80px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;transition:border-color .18s,background .18s;cursor:pointer}
.ex-chip .ec-top{display:flex;align-items:center;gap:6px}
.ex-chip .ec-n{width:22px;height:22px;border-radius:7px;background:var(--deep);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--muted);flex:0 0 auto}
.ex-chip .ec-name{font-size:12.5px;font-weight:700;line-height:1.3;max-height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.ex-chip .ec-meta{font-size:11px;color:var(--muted);font-weight:700}
.ex-chip.active{border-color:var(--acc-txt);background:rgba(var(--acc-rgb),.16)}
.ex-chip.active .ec-n{background:var(--red);color:var(--on-acc)}
.ex-chip.viewing{border-color:var(--hi)}
.ex-chip.done{background:#0c0c0e;border-color:#1c1c20;opacity:.7}
.ex-chip.done .ec-name{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.ex-chip.done .ec-meta{opacity:.5}
.ex-chip.done.viewing{border-color:#555}
.ex-chip.done .ec-n{background:var(--ok);color:#000}
.preview-banner{background:linear-gradient(135deg,rgba(58,160,255,.14),rgba(58,160,255,.03));border:1px solid rgba(58,160,255,.35);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.preview-banner .pb-t{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#3aa0ff;font-weight:800;margin-bottom:3px}
.preview-banner p{font-size:13px;color:var(--muted);line-height:1.4}
.set.ro{opacity:.85}
.per-side{font-size:11px;color:#ffb03a;font-weight:700;margin-top:2px}
.wk-actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.info-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--red);color:var(--acc-txt);font-weight:800;font-size:12px;transition:.15s;box-shadow:0 4px 14px var(--red-glow)}
.info-btn:active{transform:scale(.94)}
.info-btn svg{width:15px;height:15px}

/* ============ CARTAS GIRATORIAS (previsualización del día) ============ */
.flip-grid{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.flip{perspective:1100px;cursor:pointer}
.flip-in{position:relative;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;min-height:104px}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.flip-face{border:1px solid var(--line);border-radius:15px;padding:14px;background:linear-gradient(180deg,var(--card2),var(--bg2));backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.flip-front{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between}
.flip-back{position:relative;transform:rotateY(180deg);min-height:104px;display:flex;flex-direction:column;justify-content:space-between;border-color:rgba(var(--acc-rgb),.3);background:linear-gradient(135deg,rgba(var(--acc-rgb),.1),var(--bg2))}
.flip-front .ff-top{display:flex;gap:11px;align-items:flex-start}
.flip-front .ff-n{width:26px;height:26px;border-radius:8px;background:var(--deep);display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--muted);flex:0 0 auto}
.flip-front b{font-size:15px;line-height:1.15;display:block}
.flip-hint{font-size:11px;color:var(--muted);margin-top:8px}
.flip-back p{font-size:13px;line-height:1.45;color:var(--txt)}
.flip-back .btn{margin-top:10px}
/* ---- pantalla de acceso / bloqueo ---- */
#accessGate{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:26px;
  background:radial-gradient(700px 420px at 50% 0%,rgba(var(--acc-rgb),.16),transparent 70%),var(--bg)}
.ag-box{max-width:420px;width:100%;text-align:center;animation:fadeUp .5s both}
.ag-ico{font-size:54px;margin-bottom:10px;animation:pop .5s both}
.ag-t{font-size:23px;font-weight:900;margin:6px 0 8px}
.ag-m{color:var(--muted);font-size:14.5px;line-height:1.6}
.ag-mail{margin-top:14px;font-size:12px;color:var(--muted);background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;display:inline-block;word-break:break-all}
/* ---- panel admin ---- */
.adm-tabs{display:flex;gap:8px;margin-bottom:12px}
.adm-tab{flex:1;padding:10px 6px;border-radius:12px;background:var(--card2);border:1px solid var(--line);
  color:var(--muted);font-weight:800;font-size:12.5px;transition:.15s;position:relative}
.adm-tab.on{color:var(--hi);border-color:var(--acc-txt);background:linear-gradient(180deg,rgba(var(--acc-rgb),.22),rgba(var(--acc-rgb),.06))}
.adm-badge{display:inline-block;margin-left:5px;min-width:17px;padding:1px 5px;border-radius:999px;
  background:var(--red);color:var(--on-acc);font-size:10.5px;font-weight:900}
.adm-fils{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.adm-fils .chip{flex:0 0 auto;cursor:pointer}
.adm-fils .chip.on{color:var(--hi);border-color:var(--acc-txt);background:rgba(var(--acc-rgb),.16)}
.adm-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 13px;margin-bottom:8px;
  border-radius:14px;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);color:var(--txt)}
.adm-row:active{transform:scale(.99)}
.adm-av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-weight:900;font-size:15px;position:relative}
.adm-av.big{width:52px;height:52px;font-size:20px}
.adm-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.adm-info b{font-size:14px;word-break:break-all;line-height:1.2}
.adm-info .sub{font-size:11.5px}
.adm-st{flex:0 0 auto;font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;
  border:1px solid;border-radius:999px;padding:4px 9px}
.adm-crown{font-size:9.5px;background:var(--red);color:var(--on-acc);border-radius:4px;padding:1px 5px;vertical-align:middle}
.dot-on{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;
  box-shadow:0 0 8px var(--ok);animation:glowdot 1.8s infinite}
@keyframes glowdot{0%,100%{opacity:1}50%{opacity:.45}}
.adm-av .dot-on{position:absolute;top:-1px;right:-1px;margin:0;border:2px solid var(--bg2)}
.adm-empty{text-align:center;padding:38px 10px;color:var(--muted)}
.adm-empty p{margin-top:10px;font-size:14px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc-txt);border-radius:50%;
  margin:0 auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.adm-dates{display:flex;gap:10px}
.adm-lab{flex:1;display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:700}
.adm-lab .input{width:100%}
.adm-check{display:flex;align-items:center;gap:9px;padding:9px 2px;font-size:13.5px;font-weight:600;cursor:pointer}
.adm-check input{width:18px;height:18px;accent-color:var(--acc-txt);flex:0 0 auto}
.adm-plans{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
input[type=date].input{color-scheme:dark;font-family:inherit}
/* ---- marca de agua ---- */
#wmLayer{position:fixed;inset:0;z-index:99999;pointer-events:none;display:none;overflow:hidden}
.wm-i{position:absolute;transform:translate(-50%,-50%) rotate(-28deg);white-space:nowrap;
  font-size:12px;font-weight:800;letter-spacing:.5px;color:rgba(255,255,255,.085);
  text-shadow:0 1px 0 rgba(0,0,0,.15);user-select:none}
body.protected .screen,body.protected #workout,body.protected #modalCard{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.protected input,body.protected textarea{-webkit-user-select:text;user-select:text}
body.veiled #app,body.veiled #workout,body.veiled #modal{filter:blur(22px);transition:filter .12s}
@media print{html,body{display:none!important}}

function b64b(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function unseal(blob,keyB64){
  const key=await crypto.subtle.importKey('raw',b64b(keyB64),{name:'AES-GCM'},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64b(blob.i)},key,b64b(blob.c));
  const st=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(st).text());
}
/* descarga las claves permitidas y descifra sólo lo autorizado */
async function loadProtectedContent(){
  if(!(CLOUD&&AUTH))return false;
  const fs=firebase.firestore();
  PLANS=[];ROUTINES={};CATALOG=[];VIDEOS={};ROUTINE_BY_TITLE={};CONTENT_READY=false;
  try{
    const ck=await fs.collection('secure').doc('common').get();
    if(!ck.exists||!ck.data().k)return false;
    const common=await unseal(ENC.common,ck.data().k);
    ROUTINES=common.routines||{};CATALOG=common.catalog||[];VIDEOS=common.videos||{};
    Object.keys(ROUTINES).forEach(k=>{ROUTINE_BY_TITLE[ROUTINES[k].t]=ROUTINES[k]});
  }catch(e){console.warn('[FMV] contenido común:',e.message);return false}
  const ids=IS_ADMIN?ALL_PLAN_IDS:((ENT&&ENT.plans)||[]);
  for(const id of ALL_PLAN_IDS){
    if(!ids.includes(id))continue;
    try{
      const kd=await fs.collection('secure').doc('plan_'+id).get();
      if(!kd.exists||!kd.data().k)continue;
      PLANS.push(await unseal(ENC['p_'+id],kd.data().k));
    }catch(e){/* sin permiso para ese plan: simplemente no aparece */}
  }
  CONTENT_READY=true;return true;
}

function initFirebase(){
  if(typeof firebase==='undefined'||!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey)return false;
  try{if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);CLOUD=true;return true}
  catch(e){console.warn('[FMV] Firebase init falló:',e.message);CLOUD=false;return false}}
async function loadCloud(){
  if(!(CLOUD&&AUTH))return;
  try{
    const ref=firebase.firestore().collection('users').doc(AUTH.uid);
    const snap=await ref.get();
    if(snap.exists&&snap.data()&&snap.data().db){
      const rd=snap.data().db;
      // usa la nube como fuente de verdad
      applyingRemote=true;DB=rd;(DB.profiles||[]).forEach(ensureFields);
      try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}applyingRemote=false;
    }else{
      // primera vez: sube lo que haya local a la nube
      pushCloud();
    }
  }catch(e){console.warn('[FMV] loadCloud:',e.message)}
}
function startCloudSync(){
  if(!(CLOUD&&AUTH))return;
  if(cloudUnsub){cloudUnsub();cloudUnsub=null}
  const ref=firebase.firestore().collection('users').doc(AUTH.uid);
  cloudUnsub=ref.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;       // eco de nuestra propia escritura
    if(SESS)return;                                  // no interrumpir un entrenamiento en curso
    if(!snap.exists||!snap.data()||!snap.data().db)return;
    const rd=snap.data().db;
    if((rd.updatedAt||0)<=(DB.updatedAt||0))return;  // ya tenemos algo igual o más nuevo
    applyingRemote=true;DB=rd;(DB.profiles||[]).forEach(ensureFields);
    try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}applyingRemote=false;
    if(CUR){const f=DB.profiles.find(p=>p.id===CUR.id);if(f){CUR=f;rerender()}else{switchProfile()}}
    else if(document.getElementById('gate').style.display!=='none')initGate();
  },err=>console.warn('[FMV] sync:',err.message));
}

        <div><div style="font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;font-weight:800">${esc(tName(plan.name))}</div>
          <div style="font-size:20px;font-weight:900;margin:2px 0">${nextTxt}</div><div class="sub">${doneDays}/${totalDays} ${t('daysCompleted')}</div></div></div>
      <button class="btn" style="margin-top:16px" onclick="startPlan('${plan.id}')">${prog?t('continueTr'):t('startPlan')}</button></div>
    <div class="stat-row">
      <div class="stat red"><b>${calcStreak()}</b><small>${t('streak')}</small></div>
      <div class="stat"><b>${CUR.sessions.length}</b><small>${t('sessions')}</small></div>
      <div class="stat"><b>${totalVolumeK()}</b><small>${t('totalTons')}</small></div></div>
    ${hasMaxes(CUR.maxes)?maxesMini():maxesPrompt()}
    <div class="h-sec">${t('lastSessions')}</div>${recentSessions()}`;
}
function greet(){const h=new Date().getHours();const g={es:['Buenas noches','Buenos días','Buenas tardes'],en:['Good night','Good morning','Good afternoon'],fr:['Bonne nuit','Bonjour','Bon après-midi']}[LANG]||['Buenas noches','Buenos días','Buenas tardes'];

function maxesMini(){const m=CUR.maxes;return`<div class="h-sec">${t('yourMaxes')}</div>

  <button class="btn ghost sm" style="margin-top:10px;width:100%" onclick="editMaxes()">${t('editMaxes')}</button>`}
function maxesPrompt(){return`<div class="card" style="margin-top:14px;border-color:var(--red)"><div class="accent"></div>

  <button class="btn sm" onclick="editMaxes()">${t('introMaxes')}</button></div>`}
function recentSessions(){const s=CUR.sessions.slice(-4).reverse();
  if(!s.length)return`<div class="empty"><div class="em">🏋️</div>${t('noTrained')}<br>${t('startFirst')}</div>`;
  return`<div class="card">`+s.map(x=>{const pl=PLANS.find(p=>p.id===x.plan);
    return`<div class="hist-row"><div class="hi">✓</div><div style="flex:1"><b>S${x.week+1} · ${esc(tDay(x.dayName))}</b><div class="sub">${esc(pl?tName(pl.name):'')} · ${fmtDate(x.date)}</div></div>${x.avgFeel?feelBadge(x.avgFeel):''}</div>`}).join('')+`</div>`}
function ringSVG(pct){const r=42,c=2*Math.PI*r,off=c-(pct/100)*c;
  return`<div class="ring"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="${r}" stroke="${cssv('--line')}" stroke-width="9" fill="none"/>
    <circle cx="48" cy="48" r="${r}" stroke="${cssv('--red')}" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="filter:drop-shadow(0 0 6px var(--red-glow))"/></svg><div class="pct">${pct}%</div></div>`}

function startPlan(id){

  CUR.activePlan=id;VIEW.plan=id;const prog=CUR.progress[id];if(prog){VIEW.week=prog.week;VIEW.day=prog.day}else{VIEW.week=0;VIEW.day=0}

function weekHTML(plan,w,wi,doneSet){const dc=w.days.filter((d,di)=>doneSet.has(wi+'-'+di)).length;
  return`<div class="week ${wi===VIEW.week?'open':''}" id="wk${wi}"><div class="week-h" onclick="toggleWeek(${wi})">
      <div class="week-num">${wi+1}</div><div style="flex:1"><div class="week-tag">${t('week')} ${wi+1}</div><b>${esc(tTag(w.tag))}</b></div>

          <div style="flex:1"><b>${esc(tDay(d.d))}</b><div class="sub">${d.ex.filter(e=>e.ref!=='routine').length} ${t('exercise').toLowerCase()} · ${d.ex.filter(e=>e.ref==='routine').length} rt</div></div>

function resetDay(planId,wi,di){confirm2(t('reset'),'—',t('reset'),()=>{
  CUR.sessions=CUR.sessions.filter(s=>!(s.plan===planId&&s.week===wi&&s.day===di));
  const pr=CUR.progress[planId];if(pr&&(wi<pr.week||(wi===pr.week&&di<=pr.day)))CUR.progress[planId]={week:wi,day:di};
  save();renderPlan();toast('✓','ok')})}
function toggleWeek(wi){const w=document.getElementById('wk'+wi);const was=w.classList.contains('open');
  document.querySelectorAll('.week').forEach(x=>x.classList.remove('open'));if(!was)w.classList.add('open')}

function exDesc(e){
  const n=(e.n||'').toLowerCase();const P=(es,en,fr)=>({es,en,fr}[LANG]||es);
  if(n==='jump rope series (nivel 3)')return P('Serie de comba del Nivel 3: Speed Jumps 1 min, High Knees 30 s, Lateral Jumps 30 s y Double Unders 15 s, 3 rondas. Saltos cortos y rápidos sobre la punta de los pies.','Level 3 jump rope series: Speed Jumps 1 min, High Knees 30 s, Lateral Jumps 30 s and Double Unders 15 s, 3 rounds. Short, quick hops on the balls of the feet.','Série de corde N3 : Speed Jumps 1 min, High Knees 30 s, Lateral Jumps 30 s, Double Unders 15 s, 3 tours.');
  if(n==='strength shoes high hurdle jumps')return P('Con Strength Shoes: salta seguidas 6 vallas altas con los pies juntos, despegando y aterrizando sobre la punta. Mínimo tiempo de contacto con el suelo. 4 pasadas.','In Strength Shoes: jump 6 high hurdles in a row with feet together, taking off and landing on the balls of the feet. Minimal ground contact. 4 runs.','Avec Strength Shoes : enchaîne 6 haies hautes pieds joints, contact au sol minimal. 4 passages.');
  if(n==='weighted vest ss flamingo jumps')return P('Con chaleco lastrado y Strength Shoes: saltos laterales a una pierna sobre una valla baja, de lado a lado. Aterriza estable sobre la punta y mantén la cadera alineada. 10 por serie.','With a weighted vest and Strength Shoes: single-leg lateral hops over a low hurdle, side to side. Land stable on the ball of the foot with the hips level. 10 per set.','Gilet lesté + Strength Shoes : sauts latéraux sur une jambe par-dessus une petite haie. 10 par série.');
  if(n==='ss weighted lateral sled pulls')return P('Con Strength Shoes: arrastra el trineo con peso en desplazamiento lateral 20 yardas, cadera baja y empujando con la pierna de atrás como en la zancada. Haz los dos lados.','In Strength Shoes: pull a weighted sled moving laterally for 20 yards, hips low and driving with the back leg like in the stride. Do both sides.','Avec Strength Shoes : tire le traîneau lesté en déplacement latéral sur 20 yards, hanches basses. Les deux côtés.');
  if(n==='ss full tilt heavy sled pulls')return P('Con Strength Shoes: arrastre de trineo pesado hacia delante 20 yardas, cuerpo muy inclinado («full tilt») y pasos cortos y potentes empujando desde la punta.','In Strength Shoes: heavy sled pull forward for 20 yards, body leaning hard ("full tilt") with short, powerful steps driving off the balls of the feet.','Avec Strength Shoes : traîneau lourd vers l\'avant sur 20 yards, corps très incliné, pas courts et puissants.');
  if(n==='lateral sprints squat start')return P('Sprint lateral de 20 yardas saliendo desde posición de sentadilla: explota de lado sin cruzar los pies al arrancar y mantén la cadera baja los primeros pasos.','20-yard lateral sprint from a squat start: explode sideways without crossing the feet on the first step and keep the hips low for the first strides.','Sprint latéral de 20 yards depuis une position accroupie, hanches basses au départ.');
  if(n==='strength shoes rapid response')return P('Con Strength Shoes: Rapid Response de 10 yardas ida y vuelta, pasos muy rápidos y cortos sobre la punta de los pies, con el mínimo contacto con el suelo.','In Strength Shoes: Rapid Response for 10 yards down and back, very fast and short steps on the balls of the feet with minimal ground contact.','Avec Strength Shoes : Rapid Response sur 10 yards aller-retour, appuis très rapides.');
  if(n==='side winders (nivel 3)')return P('Side Winders del Nivel 3, 20 yardas, 1 serie hacia cada lado: Squat Slides, Foot Sync Strides e In and Outs. Desplazamiento lateral con la cadera baja, como en la zancada del lanzamiento.','Level 3 Side Winders, 20 yards, 1 set each way: Squat Slides, Foot Sync Strides and In and Outs. Lateral movement with low hips, like the pitching stride.','Side Winders N3, 20 yards, 1 série de chaque côté : Squat Slides, Foot Sync Strides, In and Outs.');
  if(n==='ss 3x lateral ankle kicks')return P('Con Strength Shoes: patadas laterales de tobillo 3X. Rebota sobre la punta y lleva el pie hacia fuera de forma rápida y controlada. 10 por serie.','In Strength Shoes: 3X lateral ankle kicks. Bounce on the ball of the foot and kick the foot out quickly and under control. 10 per set.','Avec Strength Shoes : 3X lateral ankle kicks, rapides et contrôlés. 10 par série.');
  if(n==='6-cone lateral suicide con bandas')return P('Suicida lateral con 6 conos separados 2 yardas y banda de resistencia (recoil): desplázate de lado tocando cada cono y vuelve al inicio cada vez. 4 circuitos.','Lateral suicide with 6 cones 2 yards apart and a resistance (recoil) band: shuffle sideways touching each cone and return to the start each time. 4 circuits.','Suicide latéral avec 6 plots à 2 yards et bande de résistance. 4 circuits.');
  if(e.ref==='routine'&&n==='rutina movilidad')return P('Rutina de movilidad FM (≈ 6 min): es lo primero de cada día. Pon el vídeo y síguelo de principio a fin; después toca «Rutina completada».','FM mobility routine (≈ 6 min): the first thing every day. Play the video and follow it start to finish, then tap “Routine completed”.','Routine de mobilité FM (≈ 6 min) : la première chose chaque jour. Lance la vidéo et suis-la jusqu\'au bout.');
  // Reglas del Nivel 2 y del Pre-Season (van primero porque las genéricas de abajo las confundían: p. ej. "curl" con press).
  if(/momentum drills/.test(n))return P('Momentum Drill con balón dynamax de 4 lb a 30–45 ft: acelera hacia la zancada guiando con la cadera, triple extensión antes del apoyo y aterriza con la pierna delantera firme para convertir la velocidad en torque.','Momentum drill with a 4 lb dynamax ball at 30–45 ft: accelerate into the stride leading with the hip, triple-extend before foot strike and land on a firm front leg to turn speed into torque.','Momentum drill avec ballon dynamax 4 lb à 30–45 ft : accélère vers la foulée en menant avec la hanche, triple extension avant l\'appui, jambe avant ferme.');
  if(/3x ball separation/.test(n))return P('Separación sobre el bosu 3X como montículo, con balón de 2–4 lb (o pelota): carga bien, mantén los hombros cerrados en la zancada y deja que la cadera abra antes que los hombros.','Separation drill using the 3X bosu ball as a mound, with a 2–4 lb ball (or baseball): load well, keep the shoulders closed through the stride and let the hips open before the shoulders.','Séparation sur bosu 3X comme monticule, ballon 2–4 lb ou balle : épaules fermées pendant la foulée, hanches qui s\'ouvrent avant.');
  if(/assistance throws/.test(n))return P('Lanzamiento con el recoil trainer en la cadera: un compañero tira de la banda justo cuando arrancas para ayudarte a generar más potencia y separación. Brazos relajados y hombros cerrados el mayor tiempo posible.','Throw with the recoil trainer around the hips: a partner pulls the band as you start to help you build more power and separation. Keep the arms relaxed and shoulders closed as long as possible.','Lancer avec le recoil trainer à la hanche : un partenaire tire la bande au départ pour plus de puissance et de séparation.');
  if(/med throws lateral/.test(n))return P('Med Throw lateral con balón de 2 lb a 30–45 ft: pies cerrados al objetivo, carga la pierna de empuje, abre el pie delantero para disparar la cadera y triple extensión antes del apoyo. Estabiliza la rodilla delantera.','Lateral med throw with a 2 lb ball at 30–45 ft: feet closed to the target, load the drive leg, open the front foot to fire the hips and triple-extend before foot strike. Stabilize the front knee.','Med throw latéral 2 lb à 30–45 ft : pieds fermés, charge la jambe d\'appui, ouvre le pied avant, triple extension avant l\'appui.');
  if(/load series/.test(n))return P('Serie de carga (\"Load\") en montículo con pelota a 45–60 ft: flexiona rápido la pierna de empuje y dispara la triple extensión antes de que aterrice el pie delantero. Las 3 variantes van seguidas: zancada completa, pies en paralelo a la goma y slide step.','Load series on the mound with a baseball at 45–60 ft: flex the drive leg quickly and fire triple extension before front-foot strike. The 3 variations go together: full stride, feet parallel to the rubber and slide step.','Load series au monticule avec balle à 45–60 ft : flexion rapide de la jambe d\'appui puis triple extension avant l\'appui. 3 variantes enchaînées.');
  if(/power throws/.test(n))return P('Evolución del long toss 3X: empieza de rodillas, levanta la rodilla y el pie delantero y empuja fuerte con la pierna de atrás. Aumenta la distancia (45→120 ft) sin perder la mecánica.','3X evolution of long toss: start on a knee, lift the knee and front foot and drive hard with the back leg. Increase distance (45→120 ft) without losing mechanics.','Évolution 3X du long toss : départ à genou, puis pousse fort avec la jambe arrière. Augmente la distance sans perdre la mécanique.');
  if(/lateral drives over mound/.test(n))return P('Desde detrás del montículo en posición lateral: da unos pasos laterales acelerando, apoya el pie en la goma, carga y dispara la triple extensión. Lo más bajo posible. 60 ft con pelota.','From behind the mound in a lateral stance: take a few lateral strides accelerating, plant the foot on the rubber, load and fire triple extension. Stay as low as possible. 60 ft with a baseball.','Derrière le monticule en position latérale : quelques pas latéraux, pied sur la plaque, charge et triple extension. 60 ft.');
  if(/pitch from stretch|pitching stretch/.test(n))return P('Lanzamientos desde el stretch en el montículo, a velocidad de partido y aplicando la mecánica 3X. Cuenta los lanzamientos y para si se rompe la mecánica.','Pitches from the stretch on the mound at game speed, applying the 3X mechanics. Count the pitches and stop if the mechanics break down.','Lancers depuis le stretch au monticule, vitesse de match, mécanique 3X.');
  if(/2 phase/.test(n))return P('Drill en 2 fases del Nivel 1 en el montículo: primero la carga en la pierna de empuje y después el lanzamiento completo, sin perder la separación.','Level 1 two-phase drill on the mound: first the load on the drive leg, then the full delivery, keeping separation.','Drill en 2 phases du niveau 1 au monticule : charge puis lancer complet.');
  if(/bull pen/.test(n))return P('Bull pen del Pre-Season: sigue el orden y el número de lanzamientos de la semana, empezando suave. En las semanas 3 y 4 se añaden bolas rompientes y simulación de partido.','Pre-Season bullpen: follow the order and pitch count of the week, starting easy. Weeks 3 and 4 add breaking balls and a game simulation.','Bullpen de pré-saison : suis l\'ordre et le nombre de lancers de la semaine.');
  if(/hammer curl/.test(n))return P('Curl martillo con mancuernas: palmas mirándose, codos pegados al cuerpo; sube sin balancear y baja controlado.','Dumbbell hammer curl: palms facing each other, elbows tucked; curl without swinging and lower under control.','Curl marteau : paumes face à face, coudes collés, sans balancer.');
  if(/21'?s/.test(n))return P('Curl de bíceps con barra en 21: 7 repeticiones de abajo a la mitad, 7 de la mitad arriba y 7 completas, sin descanso.','Barbell biceps 21s: 7 reps bottom to halfway, 7 halfway to top and 7 full reps, no rest.','Curl barre en 21 : 7 bas-milieu, 7 milieu-haut, 7 complètes.');
  if(/curl/.test(n)&&!/leg curl/.test(n))return P('Curl de bíceps con mancuernas en banco inclinado: brazos colgando por detrás del cuerpo, sube sin mover el codo y baja lento.','Incline dumbbell biceps curl: arms hanging behind the body, curl without moving the elbow and lower slowly.','Curl biceps incliné : bras derrière le corps, coude fixe, descente lente.');
  if(/tricep/.test(n))return P('Extensión de tríceps: codos fijos, extiende el brazo por completo y vuelve controlado. Peso moderado, sin dolor de codo.','Triceps extension: elbows fixed, fully extend the arm and return under control. Moderate weight, no elbow pain.','Extension triceps : coudes fixes, extension complète, retour contrôlé.');

function previewDay(planId,wi,di){

    const meta=e.ref==='routine'?`${cnt}`:e.ref==='throw'?t('throwing'):e.ref==='bw'?`${cnt} · ${t('bodyweight')}`:`${cnt} · ${REF_LABEL[e.ref]||''}`;

function sessKey(){return 'rodo_sess_'+(CUR?CUR.id:'x')}
/* Sólo se guarda el PROGRESO, nunca los ejercicios: el contenido
   protegido no debe quedar en localStorage. Al reanudar se vuelve a
   pedir a Firestore y se reconstruye el día. */
function saveSess(){try{
    if(SESS){const {ex,...light}=SESS;localStorage.setItem(sessKey(),JSON.stringify(light))}
    else localStorage.removeItem(sessKey())}catch(e){}}
function clearSess(){try{localStorage.removeItem(sessKey())}catch(e){}}
function barWeight(){return U()==='lb'?45:20}
function perSideStr(w){const bar=barWeight();if(w==null||w<=bar)return'';const s=Math.round((w-bar)/2*10)/10;if(s<=0)return'';return`${s} ${U()}/${t('perSide')}`}
function needsWeightInput(e){return e.ref==='bw'&&/\bdb\b|ds sb|low row|bent over row|\bbb\b|weighted|dumbbell|mancuerna/i.test(e.n)}
/* Intensidad por fase de la semana (filosofía TopVelocity): la carga ondula.
   Base = referencia · Volumen = sube · Recuperación = baja · Rendimiento = pico. */
function weekIntensity(tag){tag=(tag||'').toLowerCase();
  if(/volum/.test(tag))return 1.07;
  if(/recup|recovery|récup|manten|in-?season/.test(tag))return 0.85;
  if(/rendim|performance/.test(tag))return 1.15;
  if(/max/.test(tag))return 1.10;
  return 1.00; /* base */}
function phaseName(tag){tag=tag||(SESS&&SESS.tag)||'';const l=tag.toLowerCase();
  if(/volum/.test(l))return t('phVolume');
  if(/recup|récup/.test(l))return t('phRecovery');
  if(/rendim|performance/.test(l))return t('phPerformance');
  if(/max/.test(l))return t('phMax');
  if(/manten|in-?season/.test(l))return t('phMaint');
  return t('phBase')}
/* Peso sugerido para accesorios (el PDF no fija peso): estimado con tus máximos,
   ratios típicos de fuerza y la fase de la semana. Orientativo — ajústalo. */
/* lb -> unidad del usuario, redondeado a 0.5 kg / 1 lb (pesos ligeros) */
function lbW(v){return U()==='lb'?v:Math.round(v*0.4536*2)/2}
const SET_UNITS={yds:{es:'yds',en:'yds',fr:'yds'},vallas:{es:'vallas',en:'hurdles',fr:'haies'},circuito:{es:'circuito',en:'circuit',fr:'circuit'}};
function setUnit(st){const u=st&&st.u&&SET_UNITS[st.u];return u?(u[LANG]||u.es):t('reps')}
function accessoryWeight(e){
  if(e.ref!=='bw')return null;
  if(/sled|trineo/i.test(e.n||''))return null;   // arrastres de trineo: no es una dominada lastrada
  const bn=CUR.maxes.bench,sq=CUR.maxes.squat,n=(e.n||'').toLowerCase();
  const k=weekIntensity(SESS&&SESS.tag);
  const R=v=>roundW(v*k);
  /* --- series de hombro: peso FIJO y ligero (no escala con el 1RM) --- */
  if(/hughsten/.test(n))return{perHand:lbW(5),fixed:true};
  if(/shoulder crossover.*2|crossover.*#\s*2/.test(n))return{perHand:lbW(25),fixed:true};
  if(/shoulder crossover/.test(n))return{perHand:lbW(20),fixed:true};
  if(/shoulder routine|shoulder symmetry/.test(n))return{perHand:lbW(5),fixed:true};
  if(/incline/.test(n)&&/\bdb\b|dumbbell/.test(n))return bn?{perHand:R(bn*0.27)}:null;
  if(/\bdb\b|ds sb|dumbbell|mancuerna/.test(n))return bn?{perHand:R(bn*0.30)}:null;   // press con mancuernas
  if(/low row|bent over row|\bbb\b.*row|\brow\b/.test(n))return bn?{total:R(bn*0.50)}:null; // remo
  if(/weighted pull|weighted.*pull|pull.*(weighted|lastrad)/.test(n))return bn?{added:R(bn*0.12)}:null;           // dominada lastrada
  if(/weighted.*(glute|ham)|(glute|ham).*weighted/.test(n))return sq?{added:R(sq*0.12)}:null;
  return null;
}

/* Racha: cuenta los días entrenados seguidos, tolerando los descansos normales
   del programa (hasta 2 días seguidos sin entrenar = hueco de 3 días de calendario).
   Solo se rompe si dejas de entrenar más de 3 días. Descansar NO pierde la racha. */
const STREAK_GAP=3;
function calcStreak(){if(!CUR.sessions.length)return 0;
  const DAY=86400000;
  const days=[...new Set(CUR.sessions.map(s=>new Date(s.date).toDateString()))]
    .map(d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime()}).sort((a,b)=>b-a);
  const today=new Date();today.setHours(0,0,0,0);const t0=today.getTime();
  if((t0-days[0])/DAY>STREAK_GAP)return 0;              // llevas demasiado sin entrenar
  let streak=1;
  for(let i=1;i<days.length;i++){
    if((days[i-1]-days[i])/DAY<=STREAK_GAP)streak++;else break;   // hueco de descanso permitido
  }
  return streak}

  const mh=CUR.maxHistory.slice();

  else html+=`<div class="card"><b>${t('evolutionMaxes')}</b><button class="btn ghost sm" style="margin-top:10px;width:100%" onclick="editMaxes()">${t('introMaxes')}</button></div>`;
  if(sessions.length){html+=`<div class="card chart-card"><b>${t('volPerSession')}</b>${volChart(sessions)}</div>`;
    const wf=sessions.filter(s=>s.avgFeel);if(wf.length)html+=`<div class="card chart-card"><b>${t('feelEffort')}</b><p class="sub" style="margin:4px 0 8px;font-size:12px">${t('easyToPain')}</p>${feelChart(wf)}</div>`}
  el.innerHTML=html}
function lineChart(mh){const W=460,H=180,pad=30;const xs=mh.map((_,i)=>mh.length===1?W/2:pad+i*(W-2*pad)/(mh.length-1));
  const all=mh.flatMap(m=>[m.squat,m.bench,m.clean]);const mn=Math.min(...all)*0.9,mx=Math.max(...all)*1.05;const y=v=>H-pad-((v-mn)/(mx-mn))*(H-2*pad);
  const line=(k,c)=>{const pts=mh.map((m,i)=>`${xs[i]},${y(m[k])}`);const dots=mh.map((m,i)=>`<circle cx="${xs[i]}" cy="${y(m[k])}" r="4" fill="${c}"/>`).join('');
    return`<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}`};
  return`<svg viewBox="0 0 ${W} ${H}" style="margin-top:10px">${[0,.5,1].map(f=>`<line x1="${pad}" x2="${W-pad}" y1="${pad+f*(H-2*pad)}" y2="${pad+f*(H-2*pad)}" stroke="${cssv('--line')}" stroke-width="1"/>`).join('')}${line('squat',cssv('--red'))}${line('bench','#3aa0ff')}${line('clean','#2ecc71')}</svg>`}
function volChart(sessions){const s=sessions.slice(-10);const W=460,H=150,pad=24,bw=(W-2*pad)/s.length*0.6;const mx=Math.max(...s.map(x=>x.vol||0),1);
  return`<svg viewBox="0 0 ${W} ${H}" style="margin-top:10px">${s.map((x,i)=>{const h=((x.vol||0)/mx)*(H-2*pad);const cx=pad+i*(W-2*pad)/s.length+((W-2*pad)/s.length-bw)/2;
    return`<rect x="${cx}" y="${H-pad-h}" width="${bw}" height="${h}" rx="4" fill="url(#g1)"><animate attributeName="height" from="0" to="${h}" dur="0.6s" fill="freeze"/><animate attributeName="y" from="${H-pad}" to="${H-pad-h}" dur="0.6s" fill="freeze"/></rect>`}).join('')}
    <defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${cssv('--acc2')}"/><stop offset="1" stop-color="${cssv('--red-dark')}"/></linearGradient></defs></svg>`}
function feelChart(sessions){const s=sessions.slice(-12);const W=460,H=130,pad=20;const xs=s.map((_,i)=>s.length===1?W/2:pad+i*(W-2*pad)/(s.length-1));
  const y=v=>pad+((v-1)/4)*(H-2*pad);const pts=s.map((x,i)=>`${xs[i]},${y(x.avgFeel)}`);const cols=['','#3aa0ff','#2ecc71','#f0a500','#ff7a00','#ff3b30'];
  return`<svg viewBox="0 0 ${W} ${H}" style="margin-top:6px"><polyline points="${pts.join(' ')}" fill="none" stroke="#555" stroke-width="2"/>${s.map((x,i)=>`<circle cx="${xs[i]}" cy="${y(x.avgFeel)}" r="5" fill="${cols[x.avgFeel]}"/>`).join('')}</svg>`}

/* estado efectivo de una cuenta, calculado igual que en las reglas */
function entStatus(e,admin){
  if(admin)return 'active';
  if(!e)return 'pending';
  if(e.status==='blocked')return 'blocked';
  if(e.status!=='active')return e.status||'pending';
  const now=Date.now();
  if(e.startAt&&now<e.startAt)return 'scheduled';
  if(!e.indefinite&&e.endAt&&now>e.endAt)return 'expired';
  return 'active';
}
function statusLabel(s){return t('st_'+s)||s}

async function registerAccount(){
  if(!(CLOUD&&AUTH))return;
  const fs=firebase.firestore(),ref=fs.collection('accounts').doc(AUTH.uid);
  try{
    const snap=await ref.get();
    if(!snap.exists){
      await ref.set({email:AUTH.email,createdAt:Date.now(),lastLogin:Date.now(),lastSeen:Date.now(),loginCount:1});
    }else{

/* ---- carga y vigilancia del permiso ---- */
async function refreshEntitlement(){
  IS_ADMIN=isAdminEmail(AUTH&&AUTH.email);
  if(IS_ADMIN){ENT=null;ACCESS_STATE='active';return 'active'}
  try{
    const s=await firebase.firestore().collection('entitlements').doc(AUTH.uid).get();
    ENT=s.exists?s.data():null;
  }catch(e){ENT=null}
  ACCESS_STATE=entStatus(ENT,false);
  return ACCESS_STATE;
}
function watchEntitlement(){
  if(entUnsub){entUnsub();entUnsub=null}
  if(!(CLOUD&&AUTH)||IS_ADMIN)return;
  entUnsub=firebase.firestore().collection('entitlements').doc(AUTH.uid).onSnapshot(s=>{
    ENT=s.exists?s.data():null;
    const st=entStatus(ENT,false);
    if(st!==ACCESS_STATE){ACCESS_STATE=st;applyAccessChange()}
    else if(st==='active'){
      const ids=(ENT&&ENT.plans)||[];
      const cur=PLANS.map(p=>p.id);
      if(ids.length!==cur.length||ids.some(i=>!cur.includes(i)))applyAccessChange();
    }
  },()=>{});
}
